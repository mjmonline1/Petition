<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know What’s In Your Food — Sign the UK Petition</title>
<meta name="description" content="UK Parliamentary Petition #754897. You have the right to know what pesticides are in your food. Sign before 6 August 2026.">
<meta property="og:title" content="Know What’s In Your Food — Sign the UK Petition">
<meta property="og:description" content="UK law doesn’t require pesticide residues to be listed on food labels. You have the right to know. Sign petition #754897.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://mjmonline1.github.io/Petition/">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* === VARIABLES === */
:root {
  --primary: #10B981;
  --primary-dark: #059669;
  --hero-dark: #064e3b;
  --hero-darker: #111827;
  --text-dark: #1F2937;
  --muted: #6B7280;
  --bg-light: #F9FAFB;
  --card-bg: #FFFFFF;
  --border-color: #E5E7EB;
  --sticky-height: 52px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: ‘Inter’, sans-serif;
  background: var(--bg-light);
  color: var(--text-dark);
  line-height: 1.7;
  padding-top: var(--sticky-height);
}

/* === BUTTONS === */
.btn {
  display: inline-block;
  background: var(--primary);
  color: white;
  font-weight: 700;
  text-decoration: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
  border: none;
  font-family: inherit;
}
.btn:hover { background: var(--primary-dark); }
.btn--sm  { padding: 8px 18px; font-size: 13px; }
.btn--lg  { padding: 16px 40px; font-size: 17px; }

/* === STICKY BAR === */
.sticky-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--sticky-height);
  background: var(--hero-darker);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
  border-bottom: 1px solid rgba(16,185,129,0.3);
}
.sticky-bar__label {
  font-size: 12px;
  color: #6ee7b7;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* === NAV === */
.nav {
  background: white;
  border-bottom: 1px solid var(--border-color);
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav__brand {
  font-weight: 800;
  font-size: 15px;
  color: var(--primary);
}

/* === SECTION CHROME === */
.section { padding: 60px 24px; }
.section--light   { background: white; }
.section--tinted  { background: var(--bg-light); }
.section--dark    { background: var(--hero-dark); color: white; }
.section--darker  { background: var(--hero-darker); color: white; }
.container { max-width: 900px; margin: 0 auto; }
.section__eyebrow {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.section--dark  .section__eyebrow,
.section--darker .section__eyebrow { color: #6ee7b7; }
.section__title {
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 24px;
}
.section--dark  .section__title,
.section--darker .section__title { color: white; }

/* === MOBILE === */
@media (max-width: 600px) {
  .sticky-bar__label { display: none; }
  .nav__brand        { font-size: 13px; }
  .section { padding: 40px 20px; }
}
</style>
</head>
<body>

<!-- STICKY BAR -->
<div class="sticky-bar">
  <span class="sticky-bar__label">UK Parliamentary Petition #754897</span>
  <a href="https://petition.parliament.uk/petitions/754897"
     target="_blank" rel="noopener noreferrer"
     class="btn btn--sm">✍ Sign the petition →</a>
</div>

<!-- NAV -->
<nav class="nav">
  <span class="nav__brand">🌿 Know What’s In Your Food</span>
  <a href="https://petition.parliament.uk/petitions/754897"
     target="_blank" rel="noopener noreferrer"
     class="btn btn--sm">✍ Sign the petition →</a>
</nav>

</body>
</html>
